name: Review recovered Phong Than source

on:
  push:
    branches:
      - 'import/**'
  pull_request:
    paths:
      - 'recovered/PhongThanSource/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-import:
    name: Check source-only import and publish report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect files changed relative to main (no legacy executables run)
        run: |
          git fetch --no-tags origin main
          python tools/check_recovered_import.py \
            --base origin/main \
            --json reports/recovered-import.json \
            --markdown reports/recovered-import.md
      - name: Write report into the GitHub Actions summary
        if: always()
        run: |
          if test -f reports/recovered-import.md; then
            cat reports/recovered-import.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source import check did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reproducible import gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-source-report
          path: reports/recovered-import.*
          if-no-files-found: warn

  draft-pr:
    name: Offer one draft PR for the imported branch
    needs: inspect-import
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/import/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GH_REPO" --state open \
            --base main --head "$HEAD_BRANCH" --json number --jq '.[0].number // ""')
          if test -n "$existing"; then
            echo "Draft/open PR already exists: #$existing"
            exit 0
          fi
          if ! gh pr create --repo "$GH_REPO" --base main \
             --head "$HEAD_BRANCH" --draft \
             --title 'Import recovered Phong Than source (review before merge)' \
             --body 'Source-only import from PT.zip via Colab. Inspect the Actions report, verify third-party redistribution rights, confirm no credentials or personal data, and review the diff before merge. The full game is not yet demonstrated to run.'; then
            echo '::warning::Cannot create PR automatically. Enable Actions PR creation in repository settings or open the compare page manually.'
            echo "Manual compare: https://github.com/$GH_REPO/compare/main...$HEAD_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi
